<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Yujing Zhang</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Yujing Zhang.</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#portfolio">Work</a></li>
                <li><a href="contact.html" style="color: #111827;">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section style="flex-grow: 1; display: flex; align-items: center;">
        <div class="container" style="width: 100%;">
            <div style="text-align: center; margin-bottom: 50px;">
                <h1 class="section-title" style="margin-bottom: 20px;">Let's Connect</h1>
                <p style="color: #4B5563; max-width: 500px; margin: 0 auto;">
                    Interested in collaborating, discussing GenAI in education, or have a project in mind? I'd love to hear from you.
                </p>
                <div style="margin-top: 30px;">
                    <a href="mailto:yujingzh@unc.edu" style="color: #111827; font-weight: 600; text-decoration: none; margin: 0 15px;">📧 yujingzh@unc.edu</a>
                    <a href="https://www.linkedin.com/in/yujingzhang233" target="_blank" style="color: #111827; font-weight: 600; text-decoration: none; margin: 0 15px;">💼 LinkedIn</a>
                </div>
            </div>

            <div class="contact-form-wrapper fade-in visible">
                <form action="https://formspree.io/f/mgopppkq" method="POST" style="background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #E5E7EB;">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin: 0;">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Yujing Zhang.</p>
        </div>
    </footer>
</body>
</html>
